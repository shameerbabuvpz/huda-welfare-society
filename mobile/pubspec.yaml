name: ayalkoottam
description: Multi-organization member, asset, and kuri management app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.0
  shared_preferences: ^2.3.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.0
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  google_fonts: ^6.2.0
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
